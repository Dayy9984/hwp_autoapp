<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inserty</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #FFFFFF;
      /* White background */
      color: #1F2937;
      /* Dark text */
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    .container {
      text-align: center;
      animation: fadeIn 0.4s ease-out;
      width: 100%;
      padding: 0 2rem;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .logo-container {
      margin-bottom: 24px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      font-size: 28px;
      font-weight: 400;
      /* No bold */
      font-family: Georgia, serif;
      /* Main Inserty font */
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: #1F2937;
      animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .subtitle {
      font-size: 13px;
      color: #6B7280;
      /* Gray 500 */
      font-weight: 500;
      animation: fadeIn 0.8s ease-out;
    }

    .loading {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.9s ease-out;
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #E86B45;
      /* Orange Accent */
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    .status {
      font-size: 11px;
      color: #9CA3AF;
      /* Gray 400 */
      font-family: inherit;
    }

    .progress-container {
      width: 160px;
      height: 3px;
      background: #F3F4F6;
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
      display: none;
      /* Initially hidden */
    }

    .progress-bar {
      height: 100%;
      background: #E86B45;
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo-container">
      <div class="logo">
        <img src="logo.png" alt="Inserty">
      </div>
      <h1>Inserty</h1>
      <p class="subtitle">AI 문서 편집의 새로운 기준</p>
    </div>

    <div class="loading">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="status" id="status">시작하는 중...</p>
    </div>
  </div>

  <script>
    // Python 준비 완료 메시지 수신
    if (window.electronSplash) {
      window.electronSplash.onStatusUpdate((message, progress) => {
        if (message) {
          document.getElementById('status').textContent = message
        }

        if (typeof progress === 'number') {
          const container = document.getElementById('progress-container')
          const bar = document.getElementById('progress-bar')
          container.style.display = 'block'
          // Ensure progress is between 0 and 100
          const width = Math.max(0, Math.min(100, progress))
          bar.style.width = width + '%'
        }
      })
    }
  </script>
</body>

</html>
