[project]
name = "inserty-mcp"
version = "0.1.0"
description = "MCP server exposing the Inserty HWP-editing backend as tools for external MCP clients."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
]

[project.scripts]
inserty-mcp = "inserty_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inserty_mcp"]
